name: mineru-stack

services:
  mineru-api:
    image: mineru:4.0.9-gpu
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mineru-api
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:${MINERU_API_PORT:-8000}:8000"
    environment:
      MINERU_MODEL_SOURCE: local
      MINERU_MODEL_SMALL_BACKEND: torch
      MINERU_MODEL_VLM_ENGINE: vllm
    command:
      - mineru-kit
      - api-server
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --tier
      - standard
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
    ipc: host
    ulimits:
      memlock: -1
      stack: 67108864
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 6
      start_period: 15m

  mineru-webui:
    image: mineru:4.0.9-gpu
    container_name: mineru-webui
    restart: unless-stopped
    init: true
    depends_on:
      mineru-api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${MINERU_WEBUI_PORT:-7860}:7860"
    environment:
      MINERU_MODEL_SOURCE: local
    command:
      - mineru-kit
      - webui
      - --api-url
      - http://mineru-api:8000
      - --server-name
      - 0.0.0.0
      - --server-port
      - "7860"

  postgres:
    image: postgres:18.6
    container_name: mineru-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mineru}
      POSTGRES_USER: ${POSTGRES_USER:-mineru}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.10.2-alpine
    container_name: mineru-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
